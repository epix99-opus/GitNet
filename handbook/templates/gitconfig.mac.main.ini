# GitNet — macOS 主配置模板（复制到 ~/.gitconfig 后按注释修改）

[user]
	name = epix99-opus
	email = epix99@icloud.com

[core]
	autocrlf = input
	# excludesfile = ~/.gitignore_global

# Agent 工作区：较宽路径在前、较窄路径在后（后者覆盖前者）。片段名按机器与工具调整。
[includeIf "gitdir:~/Dev/"]
	path = ~/.gitconfig-fragment-cursor
[includeIf "gitdir:~/agent-work/cursor/"]
	path = ~/.gitconfig-fragment-cursor
[includeIf "gitdir:~/Dev/CodexDev/"]
	path = ~/.gitconfig-fragment-codex
[includeIf "gitdir:~/agent-work/codex/"]
	path = ~/.gitconfig-fragment-codex
[includeIf "gitdir:~/agent-work/claude-code/"]
	path = ~/.gitconfig-fragment-claude-code

# 片段文件示例：~/.gitconfig-fragment-cursor → YOUR_HOST-cursor
# ~/.gitconfig-fragment-codex → YOUR_HOST-codex
# ~/.gitconfig-fragment-claude-code → YOUR_HOST-claude-code
