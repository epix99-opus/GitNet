# GitNet — Windows 主配置模板（复制到 %USERPROFILE%\.gitconfig 后按注释修改）
# 与 handbook/40-identity-and-includeIf.md 配合使用

[user]
	# 人类兜底：与 GitHub 账号一致（示例用户名请改为你的 GitHub 登录名或展示名）
	name = epix99-opus
	email = epix99@icloud.com

[core]
	autocrlf = true
	longpaths = true
	# excludesfile = %USERPROFILE%\.gitignore_global

# Agent 工作区：较宽在前、较窄在后（后者覆盖）。详见 handbook/55-multi-node-multi-agent-git.md
# glab 上 HOSTNAME 用 glab → glab-cursor / glab-codex / glab-claude-code
# [includeIf "gitdir:C:/Users/你的用户名/Dev/"]
#	path = C:/Users/你的用户名/.gitconfig-fragment-cursor
# [includeIf "gitdir:C:/Users/你的用户名/agent-work/cursor/"]
#	path = C:/Users/你的用户名/.gitconfig-fragment-cursor
# [includeIf "gitdir:C:/Users/你的用户名/Dev/CodexDev/"]
#	path = C:/Users/你的用户名/.gitconfig-fragment-codex
